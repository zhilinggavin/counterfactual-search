task_name: counterfactual_inpainting


seed: 777
sample_interval: 50

n_epochs: 500 #100


logging_dir: ./training_logs/counterfactual/fibrosis
experiment_name: fibrosis+covid
checkpoint_freq: 1
eval_counter_freq: 5

cf_gt_seg_mask_idx: 0
log_visualizations: True
skip_fid: True
# epoch_steps: 51
# train_eval_epoch: 50


compute_norms: False

dataset:
  kind: merged
  batch_size: 12 #16
  img_size: [256, 256] # hxw
  use_sampler: False #True
  reset_sampler: True
  num_workers: 20
  imagenet_norm: False # mean=[0.5], std=[0.5]
  root_dir: null
  augs: [] # only resize and norm

  datasets:
    # - kind: tuh
    - kind: fibrosis
      root_dir: /media/NAS06/gavinyue/disentanglement/scripts_segmentation/result_exp/fid/fibrosis/fid_dataset
      split_dir: /media/NAS06/gavinyue/disentanglement/benchmark/counterfactual-search/data/fibrosis_splits

      # TUH_LABEL_NAMES = {
      #     1: "kidney",
      #     2: "tumor",
      #     3: "cyst"
      # }
      scan_params:
        counterfactual_val: True
        load_masks: True
        norm_scheme: &norm
          kind: ct
          rescale: True
          # fingerprint_path: ./data/tuh_dataset_full/dataset_fingerprint_fg_tumor.json
        slicing_direction: axial
        classes: ['empty', 'fibrosis']

        sampling_class: ['fibrosis']
        # classify_labels: ['tumor']
        # classify_labels_thresh: 1000

        # fetch only kidney slices in loaders that have masks with at least `filter_class_slices_thresh` non zero pixels
        filter_class_slices: ['fibrosis']
        filter_class_slices_thresh: 100

model:
  kind: inpainting_counterfactual_cgan
  ptb_based: True # perturbation based generator
  in_channels: 1
  gen_update_freq: 5
  adv_loss: mse
  lambda_adv: 1.0
  lambda_kl: 1.0
  lambda_rec: 1.0
  lambda_tv: 0.00005
  lambda_minc: 0.0
  # precision: 16-mixed
  precision: '32'

  cyclic_rec: True

  # optimizers' parameters
  lr: 0.0002
  b1: 0.0
  b2: 0.999

  # default setting
  # encoder returns features [block_1(x), block_2(block_1(x)), ..., block_N(...)]
  enc_params:
    downsample_scales: [2, 2, 2, 2, 2]
    out_channels: [64, 128, 256, 512, 1024]
    use_snconv: false

  gen_params:
    upsample_scales: [2, 2, 2, 2, 2]
    out_channels: [1024, 512, 256, 128, 64]
    upsample_kind: bilinear
    use_snconv: false
    # indices are specifided w.r.t bottleneck (index=0) and upwards
    skip_conn: [1, 2, 3, 4]

  disc_params:
    downsample_scales: [2, 2, 2, 2, 2]
    out_channels: [64, 128, 256, 512, 1024]

  # counterfactual parameters
  num_bins: 2 # number of discrete bins into which posterior probabilities are sorted
  explain_class_idx: 0 # normal/not-normal kidneys

  # classifier parameters
  classifier_kind: efficientnet_v2_s
  n_classes: 1 # number of classes in the classifier
  classifier_ckpt: /media/NAS06/gavinyue/disentanglement/benchmark/counterfactual-search/tools/training_logs/classification/fibrosis/efficientnet_v2_s-August-27-2024_07+25PM-1af55fd-fibrosis+covid/checkpoints/checkpoint_970.pth
